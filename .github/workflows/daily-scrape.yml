name: daily-scrape

# Runs every day at 01:00 UTC = 06:30 IST. Trigger manually with the
# "Run workflow" button if you want to test the pipeline immediately.
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  scrape-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run daily scrape + scoring
        env:
          # Set this secret in GitHub > Settings > Secrets and variables > Actions:
          # a postgresql:// connection string from the Supabase dashboard
          # (Database > Connect > Connection string > pooler, port 6543).
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scraper/run.py